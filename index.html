<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil Interactivo - Redesign & Effects</title>
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary-red: #ff0033;
      --dark-red: #800016;
      --bg-dark: #080606;
      --panel-bg: rgba(18, 12, 14, 0.88);
      --text-white: #ffffff;
      /* FONDO TRASERO PRINCIPAL */
      --bg-image: url('https://i.ibb.co/0Rg0jLvr/dado-1.png');
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-dark);
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
    }

    /* Contenedor Principal */
    .card-wrapper {
      position: relative;
      width: min(95vw, 1100px);
      height: 650px;
      border-radius: 20px;
      padding: 4px;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(255, 0, 51, 0.4), 0 20px 60px rgba(0, 0, 0, 0.9);
    }

    /* Borde Animado Neón */
    .card-wrapper::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        transparent 0deg,
        transparent 180deg,
        #000000 220deg,
        var(--primary-red) 270deg,
        #ff4d6d 330deg,
        #ffffff 360deg
      );
      animation: rotate-border 4s linear infinite;
      z-index: 0;
    }

    @keyframes rotate-border {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .card-container {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      background: var(--bg-image) center/cover no-repeat;
      overflow: hidden;
      z-index: 1;
    }

    /* PARTICULAS EN CANVAS (Abarca todo el espacio) */
    #particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* CORAZÓN CON CONTADOR DE LIKES (ARRIBA DERECHA) */
    .likes-badge {
      position: absolute;
      top: 25px;
      right: 35px;
      background: var(--panel-bg);
      border: 1px solid rgba(255, 0, 51, 0.5);
      border-radius: 12px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 0 20px rgba(255, 0, 51, 0.3);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .heart-icon {
      width: 26px;
      height: 26px;
      fill: var(--primary-red);
      filter: drop-shadow(0 0 8px var(--primary-red));
      animation: pulse-heart 1.5s ease-in-out infinite;
    }

    @keyframes pulse-heart {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }

    .likes-count {
      font-family: 'Syncopate', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-white);
      letter-spacing: 2px;
    }

    /* PERSONAJE UBICADO EN LA MISMA POSICIÓN DEL REPRODUCTOR (DETRÁS) */
    .character-container {
      position: absolute;
      bottom: 0;
      left: 10px;
      height: 95%;
      z-index: 4;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
    }

    /* EFECTO GLITCH ROJO Y NEGRO EN EL PERSONAJE CADA 5 SEGUNDOS */
    .character-image {
      height: 100%;
      object-fit: contain;
      object-position: bottom left;
      filter: drop-shadow(10px 10px 25px rgba(0, 0, 0, 0.8));
      animation: glitch-cycle 5s infinite;
      position: relative;
    }

    @keyframes glitch-cycle {
      0%, 92%, 100% {
        transform: translate(0, 0) skew(0deg);
        filter: drop-shadow(10px 10px 25px rgba(0, 0, 0, 0.8));
        clip-path: inset(0 0 0 0);
      }
      93% {
        transform: translate(-8px, 4px) skew(3deg);
        filter: drop-shadow(-10px 0 15px #ff0033) contrast(180%) brightness(0.7);
        clip-path: inset(10% 0 35% 0);
      }
      94% {
        transform: translate(10px, -4px) skew(-4deg);
        filter: drop-shadow(10px 0 20px #000000) contrast(200%) invert(10%);
        clip-path: inset(40% 0 10% 0);
      }
      95% {
        transform: translate(-5px, 2px) skew(2deg);
        filter: drop-shadow(-15px 5px 25px #ff0033) saturate(300%);
        clip-path: inset(25% 0 50% 0);
      }
      96% {
        transform: translate(6px, -2px) skew(-2deg);
        filter: drop-shadow(5px -5px 15px #000000) contrast(150%);
        clip-path: inset(70% 0 5% 0);
      }
      97% {
        transform: translate(0, 0) skew(0deg);
        filter: drop-shadow(10px 10px 25px rgba(0, 0, 0, 0.8));
        clip-path: inset(0 0 0 0);
      }
    }

    /* REPRODUCTOR DE MÚSICA */
    .music-player {
      position: absolute;
      bottom: 30px;
      left: 35px;
      width: 330px;
      padding: 16px 20px;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 0, 51, 0.45);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85), 0 0 25px rgba(255, 0, 51, 0.25);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .player-header {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .album-art {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(255, 0, 51, 0.6);
      flex-shrink: 0;
    }

    .album-art svg {
      width: 32px;
      height: 32px;
      fill: #ffffff;
    }

    .track-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .track-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-white);
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .track-artist {
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.65);
      margin-top: 2px;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff4d6d, var(--primary-red));
      border-radius: 4px;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .btn-control {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, color 0.2s;
    }

    .btn-control:hover {
      color: var(--primary-red);
      transform: scale(1.12);
    }

    .btn-play {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
      color: #ffffff;
      box-shadow: 0 0 14px rgba(255, 0, 51, 0.6);
    }

    .btn-play:hover {
      transform: scale(1.08);
      box-shadow: 0 0 20px rgba(255, 0, 51, 0.9);
    }

    /* SECCIÓN DE CONTENIDO DERECHO */
    .right-content-section {
      position: absolute;
      top: 22%;
      right: 0;
      width: 520px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 20px;
      z-index: 6;
    }

    .dynamic-title-container {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: right;
      padding-right: 35px;
      pointer-events: none;
    }

    /* DEGRADADO EN MOVIMIENTO PARA TÍTULO Y SUBTEXTO */
    .dynamic-title {
      font-family: 'Syncopate', sans-serif;
      font-size: 3.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 5px;
      line-height: 1.05;

      /* Gradient properties */
      background: linear-gradient(90deg, #ffffff, #ff0033, #ff758c, #ffffff, #800016, #ff0033);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: move-gradient 3s linear infinite;
      filter: drop-shadow(0 0 15px rgba(255, 0, 51, 0.8));
    }

    .dynamic-subtext {
      font-family: 'Syncopate', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 6px;
      text-transform: uppercase;

      /* Gradient properties */
      background: linear-gradient(90deg, #ff0033, #ffffff, #ff4d6d, #800016, #ff0033);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: move-gradient 4s linear infinite reverse;
      filter: drop-shadow(0 0 12px rgba(255, 0, 51, 0.9));
    }

    @keyframes move-gradient {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    /* RECTÁNGULO VERTICAL AL LADO DERECHO CON HOVER BLANCO Y NEGRO Y DIFUMINADO */
    .sub-banner-box {
      width: 220px;
      height: 260px;
      border-top-left-radius: 16px;
      border-bottom-left-radius: 16px;
      border-top: 2px solid rgba(255, 0, 51, 0.7);
      border-bottom: 2px solid rgba(255, 0, 51, 0.7);
      border-left: 2px solid rgba(255, 0, 51, 0.7);
      border-right: none;
      overflow: hidden;
      box-shadow: -10px 10px 30px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 0, 51, 0.3);
      position: relative;
      cursor: pointer;
    }

    .sub-banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: filter 0.4s ease, transform 0.4s ease;
      filter: grayscale(0%) blur(0px);
    }

    /* HOVER EFFECT: Grayscale & Blur */
    .sub-banner-box:hover .sub-banner-img {
      filter: grayscale(100%) blur(3px) contrast(120%);
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="card-wrapper">
    <main class="card-container">

      <!-- Canvas de partículas que cubre todo el espacio -->
      <canvas id="particle-canvas"></canvas>

      <!-- Badge de Corazón con Contador Animado -->
      <div class="likes-badge">
        <svg class="heart-icon" viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <span class="likes-count" id="likes-counter">12,000</span>
      </div>

      <!-- Personaje con Efecto Glitch cada 5s -->
      <div class="character-container">
        <img class="character-image" src="https://i.ibb.co/b5MLBZPH/dado.png" alt="Personaje">
      </div>

      <!-- Reproductor de Música -->
      <div class="music-player">
        <div class="player-header">
          <div class="album-art">
            <svg viewBox="0 0 24 24">
              <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
          </div>
          <div class="track-info">
            <span class="track-title" id="song-title">Cargando...</span>
            <span class="track-artist" id="song-artist">...</span>
          </div>
        </div>

        <div class="progress-bar-container" id="progress-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="player-controls">
          <button class="btn-control" id="prev-btn" title="Anterior">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
            </svg>
          </button>
          <button class="btn-control btn-play" id="play-btn" title="Reproducir">
            <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </button>
          <button class="btn-control" id="next-btn" title="Siguiente">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Sección Derecha: Letras Dinámicas con Degradado en Movimiento + Rectángulo Vertical -->
      <div class="right-content-section">
        <div class="dynamic-title-container">
          <div class="dynamic-title">҂shirou</div>
          <div class="dynamic-subtext">(1525823861)</div>
        </div>

        <!-- Imagen Rectangular Vertical con Hover Efecto B&N + Blur -->
        <div class="sub-banner-box">
          <img class="sub-banner-img" src="https://i.ibb.co/G41x4rj5/Dise-o-sin-t-tulo.png" alt="Imagen Rectangular Vertical">
        </div>
      </div>

    </main>
  </div>

  <script>
    /* 1. CONTADOR ANIMADO DEL CORAZÓN (Incrementos de 12,000 a 12,100+) */
    let likesCount = 12000;
    const likesElement = document.getElementById('likes-counter');

    function updateLikes() {
      likesCount += Math.floor(Math.random() * 15) + 5;
      likesElement.textContent = likesCount.toLocaleString('en-US');
    }
    setInterval(updateLikes, 2500);

    /* 2. PARTÍCULAS EN MOVIMIENTO COMPLETO */
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const container = document.querySelector('.card-container');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Se generan 50 partículas distribuidas por TODO el tamaño del lienzo
    const particles = Array.from({ length: 50 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 2.5 + 1,
      speedY: Math.random() * 0.8 + 0.3,
      speedX: (Math.random() - 0.5) * 0.5,
      color: Math.random() > 0.4 ? '#ff0033' : '#ffffff',
      alpha: Math.random() * 0.7 + 0.3
    }));

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX;

        // Si sale por la parte inferior, reaparece arriba del todo
        if (p.y > canvas.height + 10) {
          p.y = -10;
          p.x = Math.random() * canvas.width;
        }

        // Si sale por los lados, reaparece en el borde opuesto
        if (p.x > canvas.width) p.x = 0;
        if (p.x < 0) p.x = canvas.width;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.fill();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* 3. REPRODUCTOR DE MÚSICA */
    const playlist = [
      {
        title: "酔いどれ知らず",
        artist: "【Kanaria】",
        src: "assets/0.mp3"
      },
      {
        title: "BLEACH",
        artist: "Romaji",
        src: "assets/1.mp3"
      }
    ];

    let currentTrack = 0;
    let isPlaying = false;

    const audio = new Audio();

    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const titleEl = document.getElementById('song-title');
    const artistEl = document.getElementById('song-artist');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');

    function loadTrack(index) {
      currentTrack = index;
      titleEl.textContent = playlist[currentTrack].title;
      artistEl.textContent = playlist[currentTrack].artist;
      audio.src = playlist[currentTrack].src;
    }

    function playTrack() {
      isPlaying = true;
      playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      audio.play().catch(err => {
        console.warn("Autoplay o carga bloqueada:", err);
      });
    }

    function pauseTrack() {
      isPlaying = false;
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      audio.pause();
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) pauseTrack();
      else playTrack();
    });

    prevBtn.addEventListener('click', () => {
      currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
      loadTrack(currentTrack);
      if (isPlaying) playTrack();
    });

    nextBtn.addEventListener('click', () => {
      currentTrack = (currentTrack + 1) % playlist.length;
      loadTrack(currentTrack);
      if (isPlaying) playTrack();
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = pct + '%';
      }
    });

    audio.addEventListener('ended', () => {
      nextBtn.click();
    });

    progressContainer.addEventListener('click', (e) => {
      const width = progressContainer.clientWidth;
      const clickX = e.offsetX;
      if (audio.duration) {
        audio.currentTime = (clickX / width) * audio.duration;
      }
    });

    loadTrack(0);
  </script>
</body>
</html>
